name: 🚀 Convert Resource Pack
description: Submit resource pack untuk dikonversi agar support 1.20.1–1.21.10
title: "[CONVERT] "
labels: ["convert"]
body:
  - type: markdown
    attributes:
      value: |
        ## 📦 Request Konversi Resource Pack
        Isi form di bawah, lalu submit. Bot akan otomatis mengkonversi pack kamu!

  - type: input
    id: pack_url
    attributes:
      label: URL Resource Pack
      description: |
        Link download pack kamu. Format yang didukung:
        - **Dropbox**: `https://www.dropbox.com/s/xxx/pack.zip?dl=0`
        - **Google Drive**: `https://drive.google.com/file/d/xxx/view`
        - **MediaFire**: `https://www.mediafire.com/file/xxx`
        - **OneDrive**: `https://1drv.ms/u/xxx`
        - **MCPacks**: `https://mcpacks.net/p/xxx`
        - **GitHub Release**: `https://github.com/user/repo/releases/download/v1/pack.zip`
      placeholder: "https://www.dropbox.com/s/xxx/pack.zip?dl=0"
    validations:
      required: true

  - type: input
    id: output_name
    attributes:
      label: Nama Output File
      description: Nama file hasil konversi (tanpa .zip)
      placeholder: "my_resourcepack_converted"
    validations:
      required: false


  - type: checkboxes
    id: confirm
    attributes:
      label: Konfirmasi
      options:
        - label: Pack sudah bisa didownload dari link di atas (tidak private/expired)
          required: true
        - label: Saya mengerti hasil konversi akan tersedia selama 7 hari di Artifacts
          required: true
          